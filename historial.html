<html lang="es">
<head>

    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-colors-metro.css">

<body>

<div w3-include-html="navbar.html"></div>

<!-- !PAGE CONTENT! -->
<div class="w3-main w3-container" style="margin-left:300px;margin-top:43px;">
    <h1>Historial de registros</h1>
    <p>

<div class="w3-padding-16 w3-cell-row">
	<div class="w3-cell w3-padding-small">
  <input class="w3-input w3-border w3-padding" type="number" placeholder="Buscar ID de llamada..." id="myInput_idllamada" onkeyup="myFunction_idllamada()">
  </div>
	<div class="w3-cell w3-padding-small">
  <input class="w3-input w3-border w3-padding" type="number" placeholder="Buscar ID de llamada padre.." id="myInput_idllamadapadre" onkeyup="myFunction_idllamadapadre()">
  </div>
	<div class="w3-cell w3-padding-small">
  <input class="w3-input w3-border w3-padding" type="text" placeholder="Buscar tipo de gestión.." id="myInput_tipogestion" onkeyup="myFunction_tipogestion()">
  </div>
	<div class="w3-cell w3-padding-small">
  <input class="w3-input w3-border w3-padding" type="text" placeholder="Buscar evento.." id="myInput_evento" onkeyup="myFunction_evento()">
  </div>
</div>
</p>
    <div class="w3-container" id="respuesta"></div>
</div>

    
<script>
    
$(document).ready(function(){
    $.ajax({
        url: 'tabladedatos.php',
        type: 'post',
        data: "ok",
        success: function(data) { 
             $('#respuesta').html(data);
        }
      });
  });
</script>
<script>
function myFunction_idllamada() {
  var input, filter, table, tr, td, i;
  input = document.getElementById("myInput_idllamada");
  filter = input.value.toUpperCase();
  table = document.getElementById("tabla_datos");
  tr = table.getElementsByTagName("tr");
  for (i = 0; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[4];
    if (td) {
      txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }
  }
}

}
